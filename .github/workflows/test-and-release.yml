name: Test and Release

env:
  # Keep in sync with .changeset/config.json:baseBranch
  MAIN_REF: refs/heads/main

on:
  push:
    branches: ["**"]

concurrency: ${{ github.workflow }}-${{ github.ref }}

# Publish to npm with OIDC
permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  test-and-release:
    name: Test and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mise
        uses: jdx/mise-action@v5
        with:
          version: 2026.11.7

      # for npx publish
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Typecheck packages
        run: bun run types

      - name: Test packages
        run: bun run test

      - name: Test components with Nuxt
        run: bun run test:component

      # The runner image already carries the shared libraries Chromium needs, so --with-deps would only add unused fonts.
      - name: Install browser for Nuxt integration tests
        run: bunx playwright install chromium-headless-shell

      - name: Test packed Nuxt integrations
        run: bun run test:nuxt

      - name: Capture new release versions
        if: ${{ github.ref == env.MAIN_REF }}
        run: |
          if npx @changesets/cli status --output=release.json; then
            # Changesets also lists dependents with type "none" whose versions stay unchanged.
            echo "CHANGED_PACKAGES=$(jq -r '.releases | map(select(.type != "none") | .name + "@" + .newVersion) | join(", ")' release.json)" >> "$GITHUB_ENV"
          fi
          rm -f release.json

      - name: Create Release Pull Request or Publish to npm
        if: ${{ github.ref == env.MAIN_REF }}
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: npx changeset publish
          title: "Release ${{ env.CHANGED_PACKAGES }}"
          commit: "Release ${{ env.CHANGED_PACKAGES }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
